<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Research Testing Prototype</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; line-height: 1.45; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
  .summary-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .summary-card { border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; min-width: 120px; }
  .summary-card .label { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 0.04em; }
  .summary-card .value { font-size: 20px; font-weight: 600; }
  .run { border: 1px solid #ddd; border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
  .run-header { padding: 10px 14px; background: rgba(127,127,127,0.08); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .proposal { border-top: 1px solid #eee; padding: 12px 14px; }
  .proposal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ticker { font-weight: 700; font-size: 15px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.would-create { color: #1a7f37; }
  .badge.pending { color: #9a6700; }
  .badge.data { color: #888; }
  .evidence { font-size: 13px; color: #555; margin-top: 6px; white-space: pre-wrap; }
  .grading { margin-top: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .grading label { display: flex; align-items: center; gap: 4px; }
  .grading select, .grading input[type=text] { font-size: 13px; padding: 2px 4px; }
  .grading button { font-size: 13px; padding: 4px 10px; cursor: pointer; }
  .existing-grades { margin-top: 8px; font-size: 12px; color: #666; }
  .no-runs { color: #888; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
  <h1>Research Testing Prototype</h1>
  <div class="subtitle">Agent 1, fixed ticker universe, paper-only. Not the production "Lab" feature. Grades feed the feedback loop after the frozen baseline window closes.</div>

  <div class="summary-bar" id="summary-bar"></div>
  <div id="runs"></div>

<script>
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

function badgeFor(p) {
  if (p.createdProposal?.dryRun) return `<span class="badge would-create">would ${p.createdProposal.side}</span>`;
  if (p.outcome === "reviewed") return `<span class="badge pending">HOLD / no proposal</span>`;
  return `<span class="badge data">${p.outcome ?? "unknown"}</span>`;
}

function gradingRowHtml(proposalId) {
  return `
    <div class="grading" data-proposal-id="${proposalId}">
      <label>Grader
        <select class="grader">
          <option value="sam">Sam</option>
          <option value="partner">Partner</option>
        </select>
      </label>
      <label><input type="checkbox" class="wouldApprove" /> Would approve</label>
      <label><input type="checkbox" class="reasoningSound" checked /> Reasoning sound</label>
      <label><input type="checkbox" class="missedSomething" /> Missed something</label>
      <label>Score
        <select class="score">
          <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option>
        </select>
      </label>
      <label>Comment <input type="text" class="comment" placeholder="optional" size="24" /></label>
      <button class="submit-grade">Save grade</button>
      <span class="save-status"></span>
    </div>
    <div class="existing-grades" data-existing-for="${proposalId}">loading grades...</div>
  `;
}

function proposalHtml(p) {
  const evidence = p.recommendation
    ? `${p.recommendation.action} -- confidence ${p.recommendation.confidence ?? "n/a"} -- ${p.recommendation.rationale ?? ""}`
    : (p.reason ?? "");
  return `
    <div class="proposal" data-proposal-id="${p.proposalId}">
      <div class="proposal-head">
        <span class="ticker">${p.ticker}</span>
        ${badgeFor(p)}
        <span style="color:#888;font-size:12px;">quant ${p.quantScore ?? "n/a"} · evaluator: ${p.evaluatorVerdict ?? "n/a"}</span>
      </div>
      <div class="evidence">${evidence}</div>
      ${gradingRowHtml(p.proposalId)}
    </div>
  `;
}

function runHtml(run) {
  const proposals = (run.proposals ?? []).map(proposalHtml).join("");
  return `
    <div class="run">
      <div class="run-header">
        <span><strong>${run.runId}</strong></span>
        <span>${run.startedAt} -> ${run.completedAt}</span>
        <span>${run.counts.reviewed} reviewed, ${run.counts.wouldCreateProposal} would-create, ${run.counts.dataUnavailable} unavailable, ${run.counts.peerCoveragePending} pending, ${run.counts.error} errors</span>
      </div>
      ${proposals || '<div class="proposal">No proposal records for this run.</div>'}
    </div>
  `;
}

async function loadExistingGrades(proposalId) {
  const el = document.querySelector(`[data-existing-for="${CSS.escape(proposalId)}"]`);
  if (!el) return;
  try {
    const { grades } = await api(`/api/grades?proposalId=${encodeURIComponent(proposalId)}`);
    el.textContent = grades.length
      ? grades.map((g) => `${g.grader}: score ${g.score}, ${g.wouldApprove ? "would approve" : "would not approve"}`).join(" · ")
      : "No grades yet.";
  } catch {
    el.textContent = "Could not load grades.";
  }
}

async function submitGrade(container) {
  const proposalId = container.dataset.proposalId;
  const status = container.querySelector(".save-status");
  const grade = {
    proposalId,
    grader: container.querySelector(".grader").value,
    wouldApprove: container.querySelector(".wouldApprove").checked,
    reasoningSound: container.querySelector(".reasoningSound").checked,
    missedSomething: container.querySelector(".missedSomething").checked,
    score: Number(container.querySelector(".score").value),
    comment: container.querySelector(".comment").value,
  };
  status.textContent = "saving...";
  try {
    await api("/api/grades", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(grade) });
    status.textContent = "saved.";
    loadExistingGrades(proposalId);
  } catch (err) {
    status.textContent = `error: ${err.message}`;
  }
}

async function loadSummary() {
  const el = document.getElementById("summary-bar");
  try {
    const { gradeSummary, feedbackState } = await api("/api/summary");
    const cards = [
      ["Graded proposals", gradeSummary.gradedCount],
      ["Avg score", gradeSummary.avgScore ?? "-"],
      ["Would-approve rate", gradeSummary.wouldApproveRate != null ? `${Math.round(gradeSummary.wouldApproveRate * 100)}%` : "-"],
      ["Active lessons", feedbackState?.lessons?.length ?? 0],
      ["Feedback window", feedbackState?.firstRunAt ? "in progress" : "not started"],
    ];
    el.innerHTML = cards.map(([label, value]) => `<div class="summary-card"><div class="label">${label}</div><div class="value">${value}</div></div>`).join("");
  } catch {
    el.innerHTML = '<div class="summary-card">Could not load summary.</div>';
  }
}

async function loadRuns() {
  const el = document.getElementById("runs");
  try {
    const { runs } = await api("/api/runs?limit=10");
    el.innerHTML = runs.length ? runs.map(runHtml).join("") : '<div class="no-runs">No runs yet. Run jobs/proto-research-scan.js to produce the first one.</div>';
    for (const run of runs) {
      for (const p of run.proposals ?? []) loadExistingGrades(p.proposalId);
    }
  } catch (err) {
    el.innerHTML = `<div class="no-runs">Could not load runs: ${err.message}</div>`;
  }
}

document.addEventListener("click", (e) => {
  if (e.target.classList.contains("submit-grade")) {
    submitGrade(e.target.closest(".grading"));
  }
});

loadSummary();
loadRuns();
</script>
</body>
</html>
